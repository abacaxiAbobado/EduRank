version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: edurank_db
    environment:
      POSTGRES_USER: edurank_user
      POSTGRES_PASSWORD: edurank_password_123
      POSTGRES_DB: edurank
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edurank_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend (Node.js/Express)
  backend:
    build:
      context: ./App
      dockerfile: Dockerfile
    container_name: edurank_backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://edurank_user:edurank_password_123@postgres:5432/edurank
      JWT_SECRET: sua_chave_jwt_super_secreta_aqui_minimo_32_caracteres
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost,http://127.0.0.1:3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  default:
    name: edurank_network
