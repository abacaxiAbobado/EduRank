<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduRank — Entrar</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="bg-orbs">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
</div>

<div class="wrapper">
  <div class="brand">
    <div class="brand-logo">EduRank</div>
    <div class="brand-tagline">Aprenda. Responda. Evolua.</div>
  </div>

  <div class="card">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login')">Entrar</button>
      <button class="tab-btn" onclick="switchTab('register')">Cadastrar</button>
    </div>

    <div id="msg" class="msg"></div>

    <!-- Login -->
    <form class="form active" id="form-login" onsubmit="handleLogin(event)">
      <div class="field">
        <label>E-mail</label>
        <input type="email" id="login-email" placeholder="seu@email.com" required>
      </div>
      <div class="field">
        <label>Senha</label>
        <input type="password" id="login-password" placeholder="••••••••" required>
      </div>
      <button class="btn-primary" type="submit" id="btn-login">Entrar</button>
    </form>

    <!-- Cadastro -->
    <form class="form" id="form-register" onsubmit="handleRegister(event)">
      <div class="field">
        <label>Nome</label>
        <input type="text" id="reg-name" placeholder="Seu nome completo" required>
      </div>
      <div class="field">
        <label>E-mail</label>
        <input type="email" id="reg-email" placeholder="seu@email.com" required>
      </div>
      <div class="field">
        <label>Senha</label>
        <input type="password" id="reg-password" placeholder="Mínimo 6 caracteres" required minlength="6">
      </div>
      <button class="btn-primary" type="submit" id="btn-register">Criar conta</button>
    </form>

    <div class="divider">recursos</div>

    <div class="features">
      <div class="feature">
        <div class="feature-icon">📚</div>
        <div class="feature-label">Conteúdos de estudo</div>
      </div>
      <div class="feature">
        <div class="feature-icon">🧠</div>
        <div class="feature-label">Quizzes interativos</div>
      </div>
      <div class="feature">
        <div class="feature-icon">🏆</div>
        <div class="feature-label">Ranking global</div>
      </div>
    </div>
  </div>
</div>

<script src="login.js"></script>

</body>
</html>
